apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress-external
  namespace: default-dev
spec:
  podSelector:
    matchLabels:
      app: qoves-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 140.82.121.6/32
      ports:
        - protocol: TCP
          port: 443
