apiVersion: apps/v1
kind: Deployment
metadata:
  name: qoves-api
  namespace: default-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qoves-api
  template:
    metadata:
      labels:
        app: qoves-api
    spec:
      containers:
        - name: api
          image: qoves-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
