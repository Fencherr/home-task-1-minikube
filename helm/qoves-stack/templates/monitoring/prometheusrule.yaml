apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qoves-api-alerts
  namespace: default-dev
  labels:
    release: prometheus
spec:
  groups:
    - name: qoves-api
      rules:
        - alert: APIHealthCheckFailing
          expr: rate(healthz_errors_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "QOVES API health check is failing"
            description: "The API /healthz endpoint has been returning errors for over 1 minute — the database connection is likely down. Actionable: check postgres-0 pod status and PVC binding."
