apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qoves-api-alerts
  namespace: default-dev
  labels:
    release: prometheus
spec:
  groups:
  - name: qoves-api
    rules:
    - alert: APIDown
      expr: up{namespace="default-dev", job="qoves-api"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "QOVES API is down"
        description: "The API has had its /metrics endpoint unreachable for over 1 minute. Actionable: check pod status, logs, and resource limits."
