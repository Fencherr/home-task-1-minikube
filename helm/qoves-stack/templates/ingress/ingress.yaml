apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qoves-api
  namespace: default-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: qoves.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qoves-api
                port:
                  number: 8080
